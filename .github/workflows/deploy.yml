name: Build Deploy Verify Student PHP CRUD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: student
  INSTANCE_ID: i-05a6d3221095015b9
  PUBLIC_URL: http://52.66.14.67
  SECRETS_MANAGER_ID: deptic/student/secrets
  CONTAINER_PORT: "80"

jobs:
  build:
    name: Build Diagnostics and Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build diagnostics - inventory of deployment files
        run: |
          echo "=== Repository root listing ==="
          ls -la
          echo "=== PHP files detected (evidence-derived) ==="
          ls -la *.php || true
          for f in api.php Dashboard.php connection.php delete.php edit.php login.php logout.php signup.php userdashboard.php; do
            if [ -f "$f" ]; then echo "OK  present: $f"; else echo "MISSING: $f"; fi
          done
          echo "=== Static assets ==="
          ls -la style.css script.sh || true

      - name: Build diagnostics - PHP lint (fail on syntax errors)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y php-cli
          php -v
          FAIL=0
          for f in *.php; do
            echo "--- php -l $f ---"
            php -l "$f" || FAIL=1
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "PHP syntax lint failed"
            exit 1
          fi
          echo "All PHP files lint clean."

      - name: Author Dockerfile for PHP Apache app (context ., port 80)
        run: |
          if [ ! -f Dockerfile ]; then
          cat > Dockerfile << 'DOCKERFILE'
          FROM php:8.2-apache
          RUN docker-php-ext-install mysqli && docker-php-ext-enable mysqli
          RUN a2enmod rewrite headers
          COPY . /var/www/html/
          EXPOSE 80
          DOCKERFILE
          sed -i 's/^          //' Dockerfile
          fi
          echo "=== Dockerfile ==="
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_uri=$FULL_IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"

      - name: Build Docker image (context .)
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:${{ steps.meta.outputs.image_tag }}" -t "$FULL_IMAGE:latest" .
          docker images "$FULL_IMAGE"

      - name: Save image tarball for deploy job
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker save "$FULL_IMAGE:${{ steps.meta.outputs.image_tag }}" | gzip > /tmp/app-image.tar.gz
          ls -la /tmp/app-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: /tmp/app-image.tar.gz
          retention-days: 1

  deploy:
    name: Push to ECR and Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load < /tmp/app-image.tar.gz
          docker images

      - name: Configure AWS credentials (static creds from standard env vars)
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "AWS static credentials missing (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)."
            exit 1
          fi
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region "$AWS_REGION"
          aws --version
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR login and push (direct AWS CLI)
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$FULL_IMAGE:${{ needs.build.outputs.image_tag }}"
          docker push "$FULL_IMAGE:latest"

      - name: Write SSM command payload to JSON file
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ needs.build.outputs.image_tag }}"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "export REGION=$AWS_REGION",
              "export ECR_REGISTRY=$ECR_REGISTRY",
              "export IMAGE_URI=$IMAGE_URI",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS
          sed -i 's/^          //' /tmp/ssm-params.json
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
            echo "Failed to send SSM command"
            exit 1
          fi

      - name: Wait for SSM command completion
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "CommandInvocations[0].Status" --output text)
            echo "Attempt $i: SSM status=$STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "SSM command succeeded"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "SSM command failed with status $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text || true
              exit 1
            fi
            sleep 10
          done
          echo "SSM command timed out"
          exit 1

  verify:
    name: Verify Deployment Health
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check - require HTTP 200 on public URL
        run: |
          URL="$PUBLIC_URL"
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /tmp/health-body.html -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 500 /tmp/health-body.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed - never received HTTP 200 from $URL"
          exit 1

      - name: Verify login page renders (redirect to login.php acceptable)
        run: |
          CODE=$(curl -s -L -o /tmp/final-body.html -w "%{http_code}" "$PUBLIC_URL/login.php" || true)
          echo "login.php HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "login.php not reachable"
            exit 1
          fi
          grep -i "Welcome back" /tmp/final-body.html && echo "Login page content verified" || echo "WARN: login marker not found (redirected)"

  outputs:
    name: Emit Target Outputs
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Print contract target outputs
        run: |
          {
            echo "public_ip=52.66.14.67"
            echo "public_url=http://52.66.14.67"
            echo "alb_dns_name=52.66.14.67"
            echo "instance_id=i-05a6d3221095015b9"
            echo "ecr_repo_url=759204735992.dkr.ecr.ap-south-1.amazonaws.com/student"
            echo "security_group_id=sg-0f6f5c669dd0ec039"
            echo "iam_instance_profile=student-instance-profile"
            echo "iam_role=student-ec2-role"
          } | tee -a "$GITHUB_STEP_SUMMARY"