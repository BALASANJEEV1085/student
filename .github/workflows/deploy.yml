name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student
  INSTANCE_ID: i-05a6d3221095015b9
  PUBLIC_URL: http://52.66.14.67
  CONTAINER_PORT: "80"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build-and-push:
    name: Build diagnostics and push image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.IMAGE_TAG }}
      image_uri: ${{ steps.meta.outputs.IMAGE_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build diagnostics - inventory of deployment files
        run: |
          set -euo pipefail
          echo "=== Repository tree (depth 2) ==="
          find . -maxdepth 2 -not -path '*/.git*' -not -path '.' | sort
          echo "=== PHP files detected (runtime context) ==="
          find . -maxdepth 2 -name '*.php' -not -path '*/.git/*' | sort
          echo "=== Entry points / topology ==="
          for f in login.php Dashboard.php userdashboard.php signup.php edit.php delete.php logout.php connection.php api.php; do
            if [ -f "$f" ]; then echo "present: $f"; else echo "MISSING: $f"; fi
          done
          echo "=== Assets ==="
          ls -la style.css script.sh 2>/dev/null || true

      - name: Build diagnostics - PHP lint (if engine available)
        run: |
          if command -v php >/dev/null 2>&1; then
            php -v
            FAIL=0
            while IFS= read -r f; do
              if ! php -l "$f"; then FAIL=1; fi
            done < <(find . -maxdepth 2 -name '*.php' -not -path '*/.git/*')
            if [ "$FAIL" -ne 0 ]; then echo "::error::PHP syntax check failed"; exit 1; fi
          else
            echo "php CLI not present on runner - skipping lint; container build is the source of truth"
          fi

      - name: Materialize Dockerfile for PHP Apache context (repo has none)
        run: |
          set -euo pipefail
          cat > Dockerfile <<'DOCKERFILE'
          FROM php:8.2-apache
          RUN docker-php-ext-install mysqli && docker-php-ext-enable mysqli
          RUN a2enmod rewrite headers
          COPY --chown=www-data:www-data . /var/www/html/
          EXPOSE 80
          DOCKERFILE
          echo "=== Dockerfile ==="
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=${FULL_IMAGE}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: AWS CLI - login to ECR with static credentials
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build image and push to ECR
        run: |
          set -euo pipefail
          IMAGE_URI="${{ steps.meta.outputs.IMAGE_URI }}"
          docker build -t "$IMAGE_URI" -t "${ECR_REPOSITORY_URI}:latest" .
          docker push "$IMAGE_URI"
          docker push "${ECR_REPOSITORY_URI}:latest"
          echo "Pushed: $IMAGE_URI"

  deploy-to-ec2:
    name: Deploy container to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM commands payload to JSON file
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          set -euo pipefail
          cat > /tmp/ssm-params.json <<SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${ECR_REPOSITORY_URI%/*}",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p $CONTAINER_PORT:$CONTAINER_PORT --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS
          echo "=== /tmp/ssm-params.json ==="
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "attempt=$i status=$STATUS"
            case "$STATUS" in
              Success) echo "SSM command succeeded"; exit 0 ;;
              InProgress|Pending|Delayed) sleep 10 ;;
              *) echo "::error::SSM command failed with status $STATUS"; aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" || true; exit 1 ;;
            esac
          done
          echo "::error::SSM command timed out"; exit 1

  verify-health:
    name: Verify production health over HTTP
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Health check - require HTTP 200
        run: |
          set -euo pipefail
          URL="$PUBLIC_URL/login.php"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/body.html -w '%{http_code}' "$URL" || true)
            echo "attempt=$i http_code=$CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 400 /tmp/body.html || true
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check never returned HTTP 200 from $URL"
          exit 1

      - name: Report deployment contract outputs
        run: |
          {
            echo "public_ip=52.66.14.67"
            echo "public_url=$PUBLIC_URL"
            echo "alb_dns_name=52.66.14.67"
            echo "instance_id=$INSTANCE_ID"
            echo "ecr_repo_url=$ECR_REPOSITORY_URI"
            echo "security_group_id=sg-0f6f5c669dd0ec039"
            echo "iam_instance_profile=student-instance-profile"
            echo "iam_role=student-ec2-role"
          } | tee -a "$GITHUB_STEP_SUMMARY"