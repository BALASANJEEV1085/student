name: build-deploy-verify
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student
  EC2_INSTANCE_ID: i-05a6d3221095015b9
  PUBLIC_URL: http://52.66.14.67
  CONTAINER_PORT: "80"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build-deploy-verify:
    name: Build, Deploy and Verify (EC2 + Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build diagnostics - inspect repository layout
        run: |
          set -eux
          pwd
          ls -la
          echo "--- PHP application files (repository root context) ---"
          ls -la *.php || true
          echo "--- Static assets ---"
          ls -la *.css *.js *.sh || true
          echo "--- Expect Dockerfile at repository root (dockerfile_path: '.') ---"
          test -f Dockerfile && cat Dockerfile

      - name: Validate PHP syntax on all application files
        run: |
          set -e
          FAIL=0
          for f in api.php connection.php Dashboard.php delete.php edit.php login.php logout.php signup.php userdashboard.php; do
            if [ -f "$f" ]; then
              echo "php -l $f"
              php -l "$f" || FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ]

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and full image URI
        id: vars
        run: |
          set -eux
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          {
            echo "ecr_registry=$ECR_REGISTRY"
            echo "image_tag=$IMAGE_TAG"
            echo "full_image=$FULL_IMAGE"
            echo "latest_image=$LATEST_IMAGE"
          } >> "$GITHUB_OUTPUT"

      - name: AWS CLI - authenticate with static credentials
        run: |
          set -eux
          aws sts get-caller-identity
          aws --version

      - name: Amazon ECR - authenticate via AWS CLI
        run: |
          set -eux
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ steps.vars.outputs.ecr_registry }}"

      - name: Docker - build application image (context '.', port 80)
        run: |
          set -eux
          docker build -f Dockerfile -t "${{ steps.vars.outputs.full_image }}" -t "${{ steps.vars.outputs.latest_image }}" .
          docker images

      - name: Docker - push image tags to Amazon ECR
        run: |
          set -eux
          docker push "${{ steps.vars.outputs.full_image }}"
          docker push "${{ steps.vars.outputs.latest_image }}"

      - name: Write SSM command payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -eux",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:latest"
            ]
          }
          SSMPARAMS
          cat /tmp/ssm-params.json

      - name: Deploy to EC2 via SSM send-command
        run: |
          set -eux
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          TIMEOUT=300; ELAPSED=0
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              InProgress|Pending|Delayed) sleep 10 ;;
              *) echo "SSM command failed with status: $STATUS"; exit 1 ;;
            esac
            ELAPSED=$((ELAPSED+10))
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then echo "Timed out waiting for SSM command"; exit 1; fi
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" --output text

      - name: Health check - require HTTP 200 on public URL
        run: |
          set -eux
          URL="$PUBLIC_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.html -w '%{http_code}' "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 500 /tmp/health.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed - never received HTTP 200 from $URL"
          exit 1