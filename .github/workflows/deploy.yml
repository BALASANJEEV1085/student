name: Build Deploy Verify (EC2 Docker)

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: student
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-0ebc0ae4026ff28ea
  SECRETS_MANAGER_ID: deptic/student/secrets
  CONTAINER_PORT: "80"
  PUBLIC_URL: http://3.7.204.117
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build:
    name: Build diagnostics and Docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build diagnostics - repository inventory
        run: |
          echo "=== Repository structure ==="
          ls -la
          echo "=== PHP application files detected ==="
          ls -la *.php || true
          echo "=== PHP syntax lint (php -l) ==="
          for f in *.php; do
            [ -e "$f" ] || continue
            php -l "$f" || exit 1
          done
          echo "=== Entrypoint / topology evidence ==="
          grep -l "session_start" *.php || true
          echo "connection.php included by: $(grep -lc "include 'connection.php'" *.php | paste -sd, -)"
          echo "=== Stylesheets ==="
          ls -la *.css || true
          echo "=== Container context: dockerfile_path='.' , detected port 80 (PHP app served by Apache/httpd on port 80) ==="

      - name: Generate Dockerfile (context '.', PHP + Apache, port 80)
        run: |
          if [ ! -f Dockerfile ]; then
            cat > Dockerfile << 'DOCKERFILE'
          FROM php:8.2-apache
          RUN docker-php-ext-install mysqli
          RUN a2enmod rewrite
          COPY . /var/www/html/
          EXPOSE 80
          DOCKERFILE
            echo "Dockerfile generated at repository root (context '.')"
          else
            echo "Existing Dockerfile found:"
            cat Dockerfile
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and full image URI
        id: meta
        run: |
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "FULL_IMAGE=$FULL_IMAGE"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Authenticate to ECR (direct AWS CLI, static credentials)
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.image_tag }}"
          docker build -t "$FULL_IMAGE" -f Dockerfile .
          docker images "$FULL_IMAGE"

      - name: Push Docker image to ECR
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.image_tag }}"
          docker push "$FULL_IMAGE"
          echo "Pushed $FULL_IMAGE"

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy container on EC2 instance (SSM send-command)
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ needs.build.outputs.image_tag }}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:${{ needs.build.outputs.image_tag }}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e DB_PASSWORD -e DB_USER 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:${{ needs.build.outputs.image_tag }}"
            ]
          }
          SSMPARAMS
          cat /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          STATUS=""
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text || echo "Pending")
            echo "Attempt $i: SSM status=$STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deploy command succeeded."
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deploy command failed with status $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "SSM command did not complete in time (last status: $STATUS)"
          exit 1

  verify:
    name: Verify production health
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check - require HTTP 200 on public URL
        run: |
          echo "Waiting for container to serve on $PUBLIC_URL ..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.html -w "%{http_code}" "$PUBLIC_URL/login.php" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed (HTTP 200)."
              head -c 300 /tmp/health.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from $PUBLIC_URL"
          exit 1

      - name: Report deployment targets
        run: |
          echo "public_ip=3.7.204.117"
          echo "public_url=http://3.7.204.117"
          echo "alb_dns_name=3.7.204.117"
          echo "instance_id=i-0ebc0ae4026ff28ea"
          echo "ecr_repo_url=759204735992.dkr.ecr.ap-south-1.amazonaws.com/student"
          echo "security_group_id=sg-0f6f5c669dd0ec039"
          echo "iam_instance_profile=student-instance-profile"
          echo "iam_role=student-ec2-role"