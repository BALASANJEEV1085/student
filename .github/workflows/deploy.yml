name: Build Deploy Verify (EC2 Docker)

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: student
  EC2_INSTANCE_ID: i-05a6d3221095015b9
  PUBLIC_URL: http://52.66.14.67
  CONTAINER_PORT: "80"
  SECRETS_MANAGER_ID: deptic/student/secrets

jobs:
  build-and-push:
    name: Build and Push PHP Image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository evidence (PHP application)
        run: |
          set -e
          echo "--- Repository scan ---"
          ls -la
          test -f login.php || { echo "login.php missing"; exit 1; }
          test -f Dashboard.php || { echo "Dashboard.php missing"; exit 1; }
          test -f connection.php || { echo "connection.php missing"; exit 1; }
          test -f style.css || { echo "style.css missing"; exit 1; }
          echo "PHP source files verified."

      - name: Generate Dockerfile (php:8.2-apache, context '.', port 80)
        run: |
          set -e
          cat > Dockerfile << 'DOCKERFILE'
          FROM php:8.2-apache
          RUN docker-php-ext-install mysqli && docker-php-ext-enable mysqli
          RUN apt-get update && apt-get install -y --no-install-recommends curl \
              && rm -rf /var/lib/apt/lists/*
          COPY . /var/www/html/
          RUN chown -R www-data:www-data /var/www/html
          EXPOSE 80
          DOCKERFILE
          echo "--- Dockerfile ---"
          cat Dockerfile

      - name: Build diagnostics (docker buildx)
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: meta
        run: |
          TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (static credentials)
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region "$AWS_REGION"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Build image (diagnostics)
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Building image: $FULL_IMAGE"
          docker buildx build --file Dockerfile --context . \
            --tag "$FULL_IMAGE" \
            --progress=plain \
            --load .
          echo "--- Built image inspect ---"
          docker images "$FULL_IMAGE"
          docker run --rm "$FULL_IMAGE" php -v

      - name: Login to ECR (direct AWS CLI)
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push image to ECR
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker tag "$FULL_IMAGE" "$LATEST_IMAGE"
          docker push "$FULL_IMAGE"
          docker push "$LATEST_IMAGE"
          echo "Pushed $FULL_IMAGE and $LATEST_IMAGE"

  deploy-to-ec2:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials (static credentials)
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region "$AWS_REGION"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Write SSM command payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:latest",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e DB_PASSWORD -e DB_USER $IMAGE_URI"
            ]
          }
          SSMPARAMS
          cat /tmp/ssm-params.json

      - name: Inject approved env names from Secrets Manager
        run: |
          set -e
          SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id "$SECRETS_MANAGER_ID" --region "$AWS_REGION" --query SecretString --output text)"
          DB_USER="$(echo "$SECRET_JSON" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("DB_USER",""))')"
          DB_PASSWORD="$(echo "$SECRET_JSON" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("DB_PASSWORD",""))')"
          python3 - << 'PYEOF'
          import json
          with open('/tmp/ssm-params.json') as f:
              payload = json.load(f)
          import os
          user = os.environ.get('DB_USER', '')
          password = os.environ.get('DB_PASSWORD', '')
          cmds = payload['commands']
          cmds = [c for c in cmds if not c.startswith('export DB_')]
          cmds.insert(0, 'export DB_PASSWORD=' + json.dumps(password))
          cmds.insert(0, 'export DB_USER=' + json.dumps(user))
          payload['commands'] = cmds
          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump(payload, f, indent=2)
          print("Injected DB_USER and DB_PASSWORD environment names into SSM payload.")
          PYEOF
        env:
          SECRETS_MANAGER_ID: ${{ env.SECRETS_MANAGER_ID }}

      - name: Send SSM command to EC2 instance
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -e
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: status=$STATUS"
            case "$STATUS" in
              Success) echo "SSM command succeeded."; exit 0 ;;
              InProgress|Pending|Delayed) sleep 10 ;;
              *) echo "SSM command failed with status $STATUS"; aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" || true; exit 1 ;;
            esac
          done
          echo "Timed out waiting for SSM command."
          exit 1

  verify:
    name: Verify Production Health
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Health check (HTTP 200 only)
        run: |
          set -e
          URL="$PUBLIC_URL/login.php"
          echo "Probing $URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.html -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200."
              head -c 400 /tmp/health.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed; never received HTTP 200."
          exit 1

      - name: Record deployment outputs
        run: |
          echo "public_ip=52.66.14.67"
          echo "public_url=http://52.66.14.67"
          echo "alb_dns_name=52.66.14.67"
          echo "instance_id=i-05a6d3221095015b9"
          echo "ecr_repo_url=759204735992.dkr.ecr.ap-south-1.amazonaws.com/student"
          echo "security_group_id=sg-0f6f5c669dd0ec039"
          echo "iam_instance_profile=student-instance-profile"
          echo "iam_role=student-ec2-role"