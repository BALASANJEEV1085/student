name: build-deploy-verify-student-crud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: student
  EC2_INSTANCE_ID: i-05a6d3221095015b9
  PUBLIC_URL: http://52.66.14.67
  CONTAINER_PORT: "80"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build:
    name: Build diagnostics and Docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build diagnostics - inventory repository evidence
        run: |
          set -euo pipefail
          echo "=== Repository inventory (PHP student CRUD app) ==="
          ls -la
          echo "--- PHP files detected ---"
          find . -maxdepth 2 -name '*.php' -type f | sort
          echo "--- Static assets ---"
          find . -maxdepth 2 -name '*.css' -type f | sort
          echo "--- Shell scripts ---"
          find . -maxdepth 2 -name '*.sh' -type f | sort

      - name: Build diagnostics - PHP lint (if php CLI available)
        run: |
          if command -v php >/dev/null 2>&1; then
            for f in $(find . -maxdepth 2 -name '*.php' -type f); do
              php -l "$f" || true
            done
          else
            echo "php CLI not present on runner; skipping lint (container build will validate syntax)."
          fi

      - name: Build diagnostics - ensure Dockerfile exists for PHP Apache context
        run: |
          set -euo pipefail
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile in repo; generating standard PHP Apache image wrapping repo context '.'"
            cat > Dockerfile <<'DOCKERFILE'
            FROM php:8.2-apache
            RUN docker-php-ext-install mysqli && docker-php-ext-enable mysqli
            COPY . /var/www/html/
            RUN chown -R www-data:www-data /var/www/html
            EXPOSE 80
            CMD ["apache2-foreground"]
          DOCKERFILE
          fi
          echo "--- Dockerfile ---"
          cat Dockerfile

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_uri=${FULL_IMAGE}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (direct AWS CLI, static credentials)
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context '.', port 80)
        run: |
          set -euo pipefail
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:${{ steps.meta.outputs.image_tag }}" -t "$FULL_IMAGE:latest" .

      - name: Push Docker image to ECR
        run: |
          set -euo pipefail
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker push "$FULL_IMAGE:${{ steps.meta.outputs.image_tag }}"
          docker push "$FULL_IMAGE:latest"

      - name: Build diagnostics - image inspect
        run: |
          set -euo pipefail
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker images "$FULL_IMAGE"
          docker inspect "$FULL_IMAGE:${{ steps.meta.outputs.image_tag }}" --format 'Image={{.Id}} ExposedPorts={{.Config.ExposedPorts}}'

  deploy:
    name: Deploy to EC2 via SSM run-command
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM commands payload to JSON file
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          set -euo pipefail
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:IMAGE_TAG_PLACEHOLDER",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:IMAGE_TAG_PLACEHOLDER"
            ]
          }
          SSMPARAMS
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${IMAGE_TAG}|g" /tmp/ssm-params.json
          cat /tmp/ssm-params.json
        shell: bash

      - name: Send SSM command to EC2 instance
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:IMGTAG",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:IMGTAG"
            ]
          }
          SSMPARAMS
          sed -i "s|IMGTAG|${IMAGE_TAG}|g" /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "Dispatched SSM command: $COMMAND_ID"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \