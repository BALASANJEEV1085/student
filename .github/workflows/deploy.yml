name: build-deploy-verify-student-system

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student
  EC2_INSTANCE_ID: i-05a6d3221095015b9
  PUBLIC_URL: http://52.66.14.67
  CONTAINER_PORT: "80"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build:
    name: Build diagnostics and Docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build diagnostics - inventory of deployment files
        run: |
          set -e
          echo "=== Repository tree (eligible files) ==="
          ls -la
          echo "=== PHP files detected ==="
          find . -maxdepth 2 -name '*.php' -type f | sort
          echo "=== Static assets detected ==="
          find . -maxdepth 2 \( -name '*.css' -o -name '*.js' -o -name '*.sh' \) -type f | sort

      - name: Build diagnostics - PHP lint (syntax check every PHP file)
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y php-cli
          PHP_FILES=$(find . -name '*.php' -type f)
          echo "$PHP_FILES"
          FAIL=0
          for f in $PHP_FILES; do
            php -l "$f" || FAIL=1
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "PHP syntax errors detected"
            exit 1
          fi
          echo "All PHP files passed lint"

      - name: Build diagnostics - verify required app entrypoints exist
        run: |
          set -e
          for f in api.php Dashboard.php connection.php delete.php edit.php login.php logout.php signup.php userdashboard.php style.css; do
            if [ ! -f "$f" ]; then
              echo "MISSING required file: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Build diagnostics - generate Dockerfile for PHP Apache app (port 80)
        run: |
          set -e
          cat > Dockerfile << 'DOCKERFILE'
          FROM php:8.2-apache
          RUN docker-php-ext-install mysqli
          RUN a2enmod rewrite headers
          COPY . /var/www/html/
          EXPOSE 80
          DOCKERFILE
          echo "=== Dockerfile ==="
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and full image URI in bash
        id: meta
        run: |
          TAG="$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$TAG"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"
          echo "Resolved image: $FULL_IMAGE"

      - name: Docker build (context '.', dockerfile at repo root)
        run: |
          set -e
          docker build -t "$ECR_REPOSITORY_URI:${{ steps.meta.outputs.image_tag }}" -t "$ECR_REPOSITORY_URI:latest" .
          docker images "$ECR_REPOSITORY_URI"

      - name: Login to ECR with AWS CLI static credentials
        run: |
          set -e
          ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push image to ECR
        run: |
          set -e
          docker push "$ECR_REPOSITORY_URI:${{ steps.meta.outputs.image_tag }}"
          docker push "$ECR_REPOSITORY_URI:latest"

  deploy:
    name: Deploy to EC2 via SSM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:${{ needs.build.outputs.image_tag }}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:${{ needs.build.outputs.image_tag }}"
            ]
          }
          SSMPARAMS
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --details \
            --query "CommandInvocations[0].Status" --output text)
          echo "SSM status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardErrorContent" --output text || true
            exit 1
          fi

  verify:
    name: Health check production URL
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for container startup
        run: sleep 20

      - name: Health check - require HTTP 200
        run: |
          set -e
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /tmp/health.html -w '%{http_code}' "$PUBLIC_URL/login.php" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed"
              head -c 500 /tmp/health.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed - no HTTP 200 from $PUBLIC_URL"
          exit 1

      - name: Verify static asset served
        run: |
          set -e
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/style.css")
          echo "style.css HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            exit 1
          fi

  outputs:
    name: Emit deployment outputs
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          {
            echo "public_ip=52.66.14.67"
            echo "public_url=http://52.66.14.67"
            echo "alb_dns_name=52.66.14.67"
            echo "instance_id=i-05a6d3221095015b9"
            echo "ecr_repo_url=759204735992.dkr.ecr.ap-south-1.amazonaws.com/student"
            echo "security_group_id=sg-0f6f5c669dd0ec039"
            echo "iam_instance_profile=student-instance-profile"
            echo "iam_role=student-ec2-role"
          } >> "$GITHUB_OUTPUT"
        id: Summary
    outputs:
      public_ip: 52.66.14.67
      public_url: http://52.66.14.67
      alb_dns_name: 52.66.14.67
      instance_id: i-05a6d3221095015b9
      ecr_repo_url: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student
      security_group_id: sg-0f6f5c669dd0ec039
      iam_instance_profile: student-instance-profile
      iam_role: student-ec2-role