name: Build Deploy Verify (EC2 Docker)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: student
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  EC2_INSTANCE_ID: i-05a6d3221095015b9
  PUBLIC_URL: http://52.66.14.67
  CONTAINER_PORT: "80"

jobs:
  build-deploy-verify:
    name: Build, Deploy and Verify PHP app on EC2 (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build diagnostics - inspect repository evidence
        run: |
          set -e
          echo "=== Repository root ==="
          ls -la
          echo "=== PHP syntax lint (if php available) ==="
          if command -v php >/dev/null 2>&1; then
            for f in api.php Dashboard.php connection.php delete.php edit.php login.php logout.php signup.php userdashboard.php; do
              if [ -f "$f" ]; then php -l "$f"; fi
            done
          else
            echo "php CLI not present on runner; skipping lint, Docker build will validate context."
          fi
          echo "=== Expected PHP entrypoints ==="
          for f in index.php login.php Dashboard.php userdashboard.php api.php connection.php signup.php edit.php delete.php logout.php style.css; do
            if [ -f "$f" ]; then echo "present: $f"; else echo "missing: $f"; fi
          done
          echo "=== Dockerfile presence ==="
          if [ -f Dockerfile ]; then echo "Dockerfile found at repo root (context: .)"; else echo "WARNING: Dockerfile missing"; fi

      - name: Ensure Dockerfile exists for PHP + Apache context
        run: |
          set -e
          if [ ! -f Dockerfile ]; then
            echo "Dockerfile absent from scanned tree; generating minimal PHP/Apache image from evidence."
            cat > Dockerfile <<'DOCKERFILE'
          FROM php:8.2-apache
          RUN docker-php-ext-install mysqli
          RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*
          COPY . /var/www/html/
          EXPOSE 80
          DOCKERFILE
          fi
          echo "=== Dockerfile ==="
          cat Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static creds from secrets)
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<CREDS
          [default]
          aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CREDS
          cat > ~/.aws/config <<CONF
          [default]
          region=${{ env.AWS_REGION }}
          output=json
          CONF
          aws --version

      - name: Login to Amazon ECR (AWS CLI)
        id: ecr-login
        run: |
          set -e
          PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::${PASSWORD}"
          echo "${PASSWORD}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" --region "$AWS_REGION" || \
            aws ecr create-repository --repository-name "${ECR_REPOSITORY}" --region "$AWS_REGION"

      - name: Build and push Docker image to ECR
        run: |
          set -e
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker buildx build \
            --file Dockerfile \
            --context . \
            --platform linux/amd64 \
            -t "$FULL_IMAGE:$IMAGE_TAG" \
            -t "$FULL_IMAGE:latest" \
            --push .
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"
          echo "Pushed $FULL_IMAGE:$IMAGE_TAG and :latest"

      - name: Write SSM command payload to JSON file
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          cat > /tmp/ssm-params.json <<SSMPARAMS
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p $CONTAINER_PORT:$CONTAINER_PORT --name app $FULL_IMAGE:latest",
              "sleep 5",
              "docker ps --filter name=app --format '{{.Status}}'"
            ]
          }
          SSMPARAMS
          echo "=== SSM payload ==="
          cat /tmp/ssm-params.json

      - name: Deploy to EC2 via SSM send-command
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          sleep 10
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then echo "SSM command succeeded"; exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" || true
              echo "SSM command failed with status $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "SSM command did not reach Success in time"
          exit 1

      - name: Verify deployment - health check (HTTP 200 only)
        run: |
          set -e
          echo "Waiting for app to become healthy at $PUBLIC_URL ..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w "%{http_code}" "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed (HTTP 200)"
              head -c 500 /tmp/health-body || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from $PUBLIC_URL"
          exit 1

      - name: Outputs summary
        run: |
          {
            echo "public_ip=52.66.14.67"
            echo "public_url=http://52.66.14.67"
            echo "alb_dns_name=52.66.14.67"
            echo "instance_id=i-05a6d3221095015b9"
            echo "ecr_repo_url=759204735992.dkr.ecr.ap-south-1.amazonaws.com/student"
            echo "security_group_id=sg-0f6f5c669dd0ec039"
            echo "iam_instance_profile=student-instance-profile"
            echo "iam_role=student-ec2-role"
          } >> "$GITHUB_OUTPUT" 2>/dev/null || true
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ----- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| public_ip | 52.66.14.67 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| public_url | http://52.66.14.67 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| instance_id | i-05a6d3221095015b9 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ecr_repo_url | 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student |" >> "$GITHUB_STEP_SUMMARY"
          echo "| image_tag | $IMAGE_TAG |" >> "$GITHUB_STEP_SUMMARY"