name: Build Deploy Verify (EC2 Docker)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student
  EC2_INSTANCE_ID: i-05a6d3221095015b9
  PUBLIC_URL: http://52.66.14.67
  CONTAINER_PORT: "80"
  DOCKER_CONTEXT: .
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository payload
        run: |
          echo "--- repository root ---"
          ls -la
          echo "--- PHP sources detected ---"
          ls -l api.php connection.php login.php logout.php signup.php Dashboard.php userdashboard.php edit.php delete.php style.css || true

      - name: Ensure Dockerfile exists at repository root
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile committed - generating PHP Apache image definition"
            cat > Dockerfile << 'DOCKERFILE'
            FROM php:8.2-apache
            RUN docker-php-ext-install mysqli && docker-php-ext-enable mysqli
            COPY . /var/www/html/
            EXPOSE 80
            DOCKERFILE
            sed -i 's/^            //' Dockerfile
          fi
          echo "--- Dockerfile ---"
          cat Dockerfile

      - name: Configure AWS credentials (static AWS CLI)
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY must be configured as repository secrets"
            exit 1
          fi
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region "$AWS_REGION"
          aws configure set output json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: vars
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "ecr_registry=$ECR_REGISTRY"
            echo "image_tag=$IMAGE_TAG"
            echo "image_uri=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "ECR_REGISTRY=$ECR_REGISTRY"
          echo "IMAGE_TAG=$IMAGE_TAG"
          echo "IMAGE_URI=$FULL_IMAGE"

      - name: ECR login (AWS CLI)
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (diagnostics)
        run: |
          FULL_IMAGE="${{ steps.vars.outputs.image_uri }}"
          docker buildx build \
            --file Dockerfile \
            --tag "$FULL_IMAGE" \
            --progress plain \
            --load \
            "$DOCKER_CONTEXT"

      - name: Build diagnostics - image inspection
        run: |
          FULL_IMAGE="${{ steps.vars.outputs.image_uri }}"
          docker images "$FULL_IMAGE"
          docker history "$FULL_IMAGE"
          docker inspect "$FULL_IMAGE" --format 'ExposedPorts: {{json .Config.ExposedPorts}} Cmd: {{json .Config.Cmd}}'

      - name: Smoke test - serve container locally on port 80
        run: |
          FULL_IMAGE="${{ steps.vars.outputs.image_uri }}"
          docker run -d --name smoke -p 80:80 "$FULL_IMAGE"
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /tmp/smoke.html -w '%{http_code}' http://localhost:80/login.php || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "local /login.php HTTP status: $CODE"
          docker logs smoke || true
          docker rm -f smoke >/dev/null
          if [ "$CODE" != "200" ]; then
            echo "::error::Local container smoke test failed (HTTP $CODE)"
            exit 1
          fi

      - name: Push image to Amazon ECR
        run: |
          FULL_IMAGE="${{ steps.vars.outputs.image_uri }}"
          docker push "$FULL_IMAGE"
          docker tag "$FULL_IMAGE" "$ECR_REPOSITORY_URI:latest"
          docker push "$ECR_REPOSITORY_URI:latest"

      - name: Deploy to EC2 via SSM send-command
        run: |
          IMAGE_URI="${{ steps.vars.outputs.image_uri }}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:__IMAGE_TAG__",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/student:__IMAGE_TAG__"
            ]
          }
          SSMPARAMS
          sed -i "s|__IMAGE_TAG__|${{ steps.vars.outputs.image_tag }}|g" /tmp/ssm-params.json
          cat /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command invoked: $COMMAND_ID"
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "poll $i: $STATUS"
            case "$STATUS" in
              Success) break ;;
              InProgress|Pending|Delayed) sleep 5 ;;
              *) echo "::error::SSM command failed with status $STATUS"; exit 1 ;;
            esac
          done
          [ "$STATUS" = "Success" ] || { echo "::error::SSM command did not succeed"; exit 1; }
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" --output text || true

      - name: Verify production health (HTTP 200 required)
        run: |
          CODE=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.html -w '%{http_code}' "$PUBLIC_URL/login.php" || true)
            echo "attempt $i: /login.php -> $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::Production health check failed for $PUBLIC_URL/login.php (HTTP $CODE)"
            exit 1
          fi
          ROOT_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
          echo "root_url_status=$ROOT_CODE"
          echo "HEALTH CHECK PASSED: $PUBLIC_URL/login.php returned HTTP 200"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Deployment complete"
            echo "- region: $AWS_REGION"
            echo "- ecr_repo_url: $ECR_REPOSITORY_URI"
            echo "- image: ${{ steps.vars.outputs.image_uri }}"
            echo "- instance_id: $EC2_INSTANCE_ID"
            echo "- public_ip: 52.66.14.67"
            echo "- public_url: $PUBLIC_URL"
            echo "- container_port: $CONTAINER_PORT"
            echo "- security_group_id: sg-0f6f5c669dd0ec039"
            echo "- iam_instance_profile: student-instance-profile"
            echo "- iam_role: student-ec2-role"
          } >> "$GITHUB_STEP_SUMMARY"